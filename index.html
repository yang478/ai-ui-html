<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Apple Style AI Prompt Generator</title>
    <meta name="description" content="专业级AI UI提示词生成器，采用Apple设计美学">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">
    <!-- Header -->
    <header class="app-header">
        <div class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/>
                <path d="M21,12.4a1,1,0,0,0-1.3-.27L17,13.9V6.5A2.5,2.5,0,0,0,14.5,4h-5A2.5,2.5,0,0,0,7,6.5v7.4l-2.7-1.77a1,1,0,0,0-1.3.27,1,1,0,0,0,.27,1.37l4.65,3.1a2.48,2.48,0,0,0,1.38.42h5.4a2.48,2.48,0,0,0,1.38-.42l4.65-3.1A1,1,0,0,0,21,12.4Z" fill="currentColor"/>
            </svg>
            <span>PromptCraft AI</span>
        </div>
        <div class="flex items-center gap-2">
            <button class="btn btn-ghost btn-icon" aria-label="API Settings" onclick="app.openApiSettings()" title="API设置">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
            </button>
            <button class="btn btn-ghost btn-icon" aria-label="Reset" onclick="app.resetState()" title="重置">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
            </button>
            <button class="btn btn-ghost btn-icon" aria-label="Help" onclick="app.showHelp()" title="帮助">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </button>
            <button class="btn btn-primary" onclick="app.openAiAssistant()" style="margin-left: 8px;">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                AI设计助手
            </button>
        </div>
    </header>

    <!-- Main Container -->
    <div class="main-container">
        <!-- Left Panel: Wizard -->
        <main class="wizard-panel" id="wizard-content">
            <div class="wizard-header">
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="progress-fill"></div>
                </div>
                <h1 class="step-title" id="step-title">选择设计目的</h1>
                <p class="step-description" id="step-desc">您希望构建什么样的用户界面？</p>
            </div>
            <div id="step-content-area" class="animate-fade-in">
                <!-- Dynamic Content Loaded Here -->
            </div>
        </main>

        <!-- Right Panel: Preview & Output -->
        <aside class="preview-panel">
            <div class="preview-header">
                <span>实时预览</span>
                <div class="flex gap-2">
                     <span class="text-xs text-secondary">Auto-updating</span>
                </div>
            </div>
            <div class="preview-content">
                <div class="preview-canvas" id="preview-canvas">
                    <!-- Mockup Rendered Here -->
                    <div class="mock-nav">
                        <div class="mock-nav-logo"></div>
                        <div class="mock-nav-link" style="width: 40px"></div>
                        <div class="mock-nav-link"></div>
                        <div class="mock-nav-link"></div>
                    </div>
                    <div class="mock-hero">
                        <div class="mock-title"></div>
                        <div class="mock-subtitle"></div>
                        <div class="mock-btn"></div>
                    </div>
                    <div class="mock-grid">
                        <div class="mock-card"></div>
                        <div class="mock-card"></div>
                    </div>
                </div>
                <div id="selection-tags" class="flex flex-wrap gap-2"></div>
            </div>

            <!-- Prompt Output -->
            <div class="prompt-output-container">
                <div class="prompt-header">
                    <span class="font-semibold text-sm">生成的提示词</span>
                    <div class="prompt-actions">
                        <select id="prompt-format" class="text-sm" style="border-radius: 6px; border: 1px solid var(--c-border); padding: 2px 8px;">
                            <option value="markdown">Markdown</option>
                            <option value="text">纯文本</option>
                            <option value="json">JSON</option>
                        </select>
                        <button class="btn btn-sm btn-primary" onclick="app.copyPrompt()">
                            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                            复制
                        </button>
                    </div>
                </div>
                <textarea id="prompt-text" readonly spellcheck="false">等待选择...</textarea>
            </div>
        </aside>
    </div>

    <!-- Footer -->
    <footer class="app-footer">
        <div class="text-sm text-secondary" id="footer-status">步骤 1 / 3</div>
        <div class="flex gap-4">
            <button class="btn btn-secondary" id="btn-prev" onclick="app.prevStep()" disabled>
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path></svg>
                上一步
            </button>
            <button class="btn btn-primary" id="btn-next" onclick="app.nextStep()">
                下一步
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"></path></svg>
            </button>
        </div>
    </footer>
</div>

<!-- API Settings Modal -->
<div class="modal-overlay" id="api-settings-modal">
    <div class="modal">
        <div class="modal-header">
            <h2 class="modal-title">LLM API设置</h2>
            <button class="modal-close" onclick="app.closeApiSettings()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="form-group">
                <label class="form-label" for="api-base-url">API Base URL</label>
                <input type="text" id="api-base-url" class="form-input" placeholder="https://api.openai.com/v1" value="https://api.openai.com/v1">
                <p class="text-xs text-secondary" style="margin-top: 4px;">OpenAI兼容的API端点</p>
            </div>
            <div class="form-group">
                <label class="form-label" for="api-key">API密钥</label>
                <input type="password" id="api-key" class="form-input" placeholder="sk-...">
                <p class="text-xs text-secondary" style="margin-top: 4px;">您的API密钥将被安全存储在本地</p>
            </div>
            <div class="form-group">
                <label class="form-label" for="api-model">模型名称</label>
                <input type="text" id="api-model" class="form-input" placeholder="gpt-3.5-turbo" value="gpt-3.5-turbo">
                <p class="text-xs text-secondary" style="margin-top: 4px;">如: gpt-3.5-turbo, gpt-4, claude-3, 等</p>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn btn-secondary" onclick="app.closeApiSettings()">取消</button>
            <button class="btn btn-primary" onclick="app.saveApiSettings()">保存设置</button>
        </div>
    </div>
</div>

<!-- AI Assistant Modal -->
<div class="modal-overlay" id="ai-assistant-modal">
    <div class="ai-chatbot-modal">
        <!-- Header -->
        <div class="ai-chatbot-header">
            <div class="ai-chatbot-title">
                <div class="ai-avatar-large">🤖</div>
                <div class="ai-title-text">
                    <h3>AI代码助手</h3>
                    <p class="ai-status">在线</p>
                </div>
            </div>
            <button class="ai-close-btn" onclick="app.closeAiAssistant()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <!-- Chat Container -->
        <div class="ai-chatbot-body">
            <!-- Messages Area -->
            <div class="ai-chatbot-messages" id="ai-messages">
                <div class="ai-welcome-screen">
                    <div class="ai-welcome-icon">✨</div>
                    <h2>欢迎使用 AI代码助手</h2>
                    <p>我可以帮助您：</p>
                    <ul class="ai-features">
                        <li>🔍 分析和优化代码</li>
                        <li>💡 提供编程建议</li>
                        <li>🐛 调试错误和解决问题</li>
                        <li>📚 解释技术概念</li>
                    </ul>
                    <div class="ai-warning">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
                            <line x1="12" y1="9" x2="12" y2="13"></line>
                            <line x1="12" y1="17" x2="12.01" y2="17"></line>
                        </svg>
                        <span>请先在左上角设置API密钥</span>
                    </div>
                </div>
            </div>

            <!-- Selection Toolbar -->
            <div class="ai-selection-toolbar" id="ai-toolbar" style="display: none;">
                <div class="ai-selection-info">
                    <label class="ai-checkbox">
                        <input type="checkbox" id="ai-select-all" onchange="app.handleSelectAll(this)">
                        <span class="ai-checkmark"></span>
                    </label>
                    <span id="ai-selected-count">0 条已选</span>
                </div>
                <div class="ai-selection-actions">
                    <button class="ai-btn ai-btn-primary" onclick="app.handleBatchCopy()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                        复制
                    </button>
                    <button class="ai-btn ai-btn-danger" onclick="app.handleBatchDelete()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                        删除
                    </button>
                    <button class="ai-btn ai-btn-ghost" onclick="app.handleExitSelect()">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18"></line>
                            <line x1="6" y1="6" x2="18" y2="18"></line>
                        </svg>
                        取消
                    </button>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="ai-chatbot-input">
            <button class="ai-select-btn" onclick="app.enterSelectionMode()" title="选择消息">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 5H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-5"></path>
                    <path d="M9 5a2 2 0 0 0 2 2h5a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2H9z"></path>
                </svg>
            </button>
            <div class="ai-input-wrapper">
                <textarea
                    id="ai-input"
                    placeholder="询问任何编程问题..."
                    rows="1"
                ></textarea>
                <div class="ai-input-actions">
                    <span class="ai-char-count">0</span>
                    <button class="ai-send-btn" id="ai-send-btn" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Toast Container -->
<div id="toast-container"></div>

<!-- Scripts -->
<script src="js/componentData.js"></script>
<script src="js/main.js"></script>

</body>
</html>
